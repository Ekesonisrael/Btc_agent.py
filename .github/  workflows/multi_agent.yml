name: Multi-Asset Trend Agent

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install ccxt pandas numpy requests
      
      - name: Run Agent
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
        run: python multi_agent.py
        
      - name: Save Journal
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add multi_journal.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Multi journal update [skip ci]"
          git push
