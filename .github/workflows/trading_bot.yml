name: OKX Trading Bot Execution

concurrency:
  group: trading-bot-lock
  cancel-in-progress: false

on:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [trigger-bot]
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Trading Bot Script
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python trading_bot.py
