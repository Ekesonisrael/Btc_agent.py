name: OKX Trading Bot Execution

concurrency:
  group: trading-bot-lock
  cancel-in-progress: false

on:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [trigger-bot]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas requests

      - name: Run Trading Bot Script
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python trading_bot.py
          
      # THIS IS THE FIX: Saves the memory so it learns
      - name: Commit and Save Journal
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add trade_journal.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update trade journal [skip ci]"
          git push || true
